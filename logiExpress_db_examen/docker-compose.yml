services:
  mysql_db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysql_logiExpress_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: logiExpress_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: